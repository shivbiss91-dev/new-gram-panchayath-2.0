<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Citizen evidence photo showing road damage near school crossing">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <!-- Distant Village School Building -->
  <rect x="460" y="95" width="260" height="125" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <polygon points="445,95 590,45 735,95" fill="#b45309"/>
  <rect x="550" y="140" width="80" height="80" fill="#78350f"/>
  <rect x="485" y="125" width="42" height="36" rx="3" fill="#bae6fd" stroke="#92400e" stroke-width="2"/>
  <rect x="653" y="125" width="42" height="36" rx="3" fill="#bae6fd" stroke="#92400e" stroke-width="2"/>
  <text x="590" y="84" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fffbeb" text-anchor="middle">ZP PRIMARY SCHOOL</text>
  <!-- Trees & Roadside Verge -->
  <rect x="0" y="210" width="800" height="35" fill="#bbf7d0"/>
  <circle cx="110" cy="145" r="48" fill="#22c55e" opacity="0.85"/>
  <rect x="103" y="185" width="14" height="35" fill="#78350f"/>
  <!-- Asphalt Road Perspective -->
  <polygon points="120,235 680,235 800,450 0,450" fill="url(#road)"/>
  <!-- Yellow Roadside Line -->
  <line x1="150" y1="240" x2="55" y2="450" stroke="#facc15" stroke-width="6" stroke-dasharray="22 14"/>
  <line x1="650" y1="240" x2="745" y2="450" stroke="#facc15" stroke-width="6" stroke-dasharray="22 14"/>
  <!-- Deep Road Crater / Pothole -->
  <ellipse cx="410" cy="340" rx="145" ry="48" fill="#0f172a" stroke="#94a3b8" stroke-width="4" stroke-dasharray="14 6"/>
  <ellipse cx="410" cy="345" rx="115" ry="32" fill="#78350f" opacity="0.85"/>
  <ellipse cx="422" cy="348" rx="75" ry="18" fill="#0284c7" opacity="0.5"/>
  <!-- Cracks radiating from damaged asphalt -->
  <path d="M275 335 L210 355 M260 365 L195 390 M540 330 L615 315 M520 375 L605 405 M410 388 L395 432" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <!-- Safety Cone -->
  <polygon points="220,255 245,255 262,330 203,330" fill="#f97316"/>
  <polygon points="215,280 250,280 254,296 211,296" fill="#ffffff"/>
  <rect x="195" y="330" width="75" height="10" rx="3" fill="#ea580c"/>
  <!-- Field Evidence Watermark Badge -->
  <rect x="24" y="24" width="320" height="58" rx="12" fill="#0f172a" fill-opacity="0.8"/>
  <circle cx="52" cy="53" r="10" fill="#ef4444"/>
  <text x="74" y="48" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">FIELD SITE EVIDENCE</text>
  <text x="74" y="68" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">Road Damage - School Crossing Zone</text>
</svg>
